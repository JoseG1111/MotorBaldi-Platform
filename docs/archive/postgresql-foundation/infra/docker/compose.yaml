name: motorbaldi-local
services:
  postgres:
    image: postgres:18.6-bookworm
    profiles: ['core-smoke','dev']
    environment:
      POSTGRES_USER: motorbaldi_owner
      POSTGRES_PASSWORD: motorbaldi_local_owner
      POSTGRES_DB: motorbaldi_local
    ports: ['127.0.0.1:55432:5432']
    volumes:
      - postgres:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U motorbaldi_owner -d motorbaldi_local']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.0.5-bookworm
    profiles: ['core-smoke','dev']
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['127.0.0.1:56379:6379']
    volumes: ['redis:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
  storage:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ['core-smoke','dev']
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: motorbaldi_local
      MINIO_ROOT_PASSWORD: motorbaldi_local_storage
    ports: ['127.0.0.1:59000:9000','127.0.0.1:59001:9001']
    volumes: ['storage:/data']
  storage-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ['core-smoke','dev']
    depends_on: [storage]
    entrypoint: ['/bin/sh','-c']
    command:
      - 'until mc alias set local http://storage:9000 motorbaldi_local motorbaldi_local_storage; do sleep 2; done; mc mb --ignore-existing local/motorbaldi-local; mc mb --ignore-existing local/motorbaldi-test; mc anonymous set none local/motorbaldi-local; mc anonymous set none local/motorbaldi-test'
  mail:
    image: axllent/mailpit:v1.29.3
    profiles: ['dev']
    ports: ['127.0.0.1:51025:1025','127.0.0.1:58025:8025']
  migrator:
    image: motorbaldi-migrator:ci
    profiles: ['core-smoke']
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: local
      INITIALIZE_DATABASE_ENVIRONMENT: 'true'
      MIGRATION_DATABASE_URL: postgresql://motorbaldi_owner:motorbaldi_local_owner@postgres:5432/motorbaldi_local
      RUNTIME_DATABASE_ROLE: motorbaldi_runtime
  api:
    image: motorbaldi-api:ci
    profiles: ['core-smoke']
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      migrator:
        condition: service_completed_successfully
    environment:
      APP_ENV: local
      PORT: 3000
      DATABASE_URL: postgresql://motorbaldi_runtime:motorbaldi_local_runtime@postgres:5432/motorbaldi_local
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: local-only-replace-with-random-32-byte-secret
      AUTH_BASE_URL: http://127.0.0.1:3000
      CORS_ORIGINS: http://localhost:5173
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_BUCKET: motorbaldi-local
      STORAGE_ACCESS_KEY: motorbaldi_local
      STORAGE_SECRET_KEY: motorbaldi_local_storage
    ports: ['127.0.0.1:3000:3000']
  worker:
    image: motorbaldi-worker:ci
    profiles: ['core-smoke']
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      migrator:
        condition: service_completed_successfully
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql://motorbaldi_runtime:motorbaldi_local_runtime@postgres:5432/motorbaldi_local
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: local-only-replace-with-random-32-byte-secret
      AUTH_BASE_URL: http://127.0.0.1:3000
      CORS_ORIGINS: http://localhost:5173
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_BUCKET: motorbaldi-local
      STORAGE_ACCESS_KEY: motorbaldi_local
      STORAGE_SECRET_KEY: motorbaldi_local_storage
volumes:
  postgres:
  redis:
  storage:
