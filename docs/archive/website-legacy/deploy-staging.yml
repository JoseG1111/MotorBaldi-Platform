name: Deploy MotorBaldi Staging

on:
  workflow_run:
    workflows: ['Foundation CI']
    types: [completed]
    branches: [master]

concurrency:
  group: motorbaldi-staging
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    name: Build and Deploy Staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - run: corepack enable
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - name: Verify exact Foundation CI head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build MotorBaldi
        run: npm run build

      - name: Scan generated artifact
        run: pnpm security:scan:dist

      - name: Verify build
        run: |
          test -f dist/index.html
          test -d dist/assets
          test -d dist/api
          echo "Build OK"

      - name: Add deployment marker
        run: |
          echo "MotorBaldi staging deployment" > dist/deploy-version.txt
          echo "commit=${{ github.event.workflow_run.head_sha }}" >> dist/deploy-version.txt
          echo "run=${GITHUB_RUN_NUMBER}" >> dist/deploy-version.txt
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> dist/deploy-version.txt

      - name: Deploy dist to Hosting Colombia
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false
